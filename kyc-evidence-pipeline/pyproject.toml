[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-evidence-pipeline"
version = "0.1.0"
description = "Auditable, document-aware KYC evidence preparation proof of concept"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "pymupdf>=1.24,<2",
  "beautifulsoup4>=4.12,<5",
  "cryptography>=42"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
local-embeddings = ["fastembed>=0.4,<1"]
delta = ["deltalake>=1.0,<2", "pyarrow>=16"]
postgres = ["psycopg[binary,pool]>=3.2,<4", "langgraph-checkpoint-postgres>=3.0,<4"]

[project.scripts]
kyc-pipeline = "kyc_pipeline.cli:main"
kyc-databricks-job = "kyc_pipeline.databricks_job:main"
kyc-evidence-server = "kyc_pipeline.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kyc_pipeline = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
